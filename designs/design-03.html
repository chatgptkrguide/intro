<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --fg: #00ff41;
  --fg-dim: #00aa2a;
  --fg-bright: #33ff66;
  --bg: #0a0a0a;
  --bg-line: rgba(0, 255, 65, 0.03);
  --prompt: #00ff41;
  --cursor: #00ff41;
  --selection: rgba(0, 255, 65, 0.2);
  --link: #00ccff;
}

body.amber {
  --fg: #ffb000;
  --fg-dim: #cc8a00;
  --fg-bright: #ffd966;
  --prompt: #ffb000;
  --cursor: #ffb000;
  --selection: rgba(255, 176, 0, 0.2);
  --link: #ff6600;
}

html { font-size: 16px; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'JetBrains Mono', monospace;
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
  word-break: keep-all;
  overflow-wrap: break-word;
}

::selection {
  background: var(--selection);
  color: var(--fg-bright);
}

/* Back to Gallery */
.back-link {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 1100;
  color: var(--fg-dim);
  text-decoration: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  padding: 6px 12px;
  border: 1px solid var(--fg-dim);
  border-radius: 4px;
  background: rgba(10, 10, 10, 0.9);
  transition: color 0.2s, border-color 0.2s, background 0.2s;
  opacity: 0;
  transform: translateY(-8px);
  animation: fadeInBack 0.5s ease 0.5s forwards;
}

.back-link:hover {
  color: var(--fg-bright);
  border-color: var(--fg-bright);
  background: rgba(0, 255, 65, 0.08);
}

body.amber .back-link:hover {
  background: rgba(255, 176, 0, 0.08);
}

@keyframes fadeInBack {
  to { opacity: 1; transform: translateY(0); }
}

/* CRT Scanline Overlay */
.scanlines {
  pointer-events: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 1px,
    rgba(0, 0, 0, 0.15) 1px,
    rgba(0, 0, 0, 0.15) 2px
  );
}

.crt-flicker {
  pointer-events: none;
  position: fixed;
  inset: 0;
  z-index: 999;
  animation: flicker 0.15s infinite;
  opacity: 0;
}

@keyframes flicker {
  0% { opacity: 0.02; }
  50% { opacity: 0; }
  100% { opacity: 0.01; }
}

/* Matrix Canvas */
#matrix-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  opacity: 0.06;
}

/* Terminal Window */
.terminal-wrapper {
  position: relative;
  z-index: 10;
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
  min-height: 100vh;
}

.terminal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #1a1a1a;
  border: 1px solid var(--fg-dim);
  border-bottom: none;
  border-radius: 8px 8px 0 0;
  padding: 10px 16px;
  margin-top: 20px;
}

.terminal-dots {
  display: flex;
  gap: 8px;
}

.terminal-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
}

.terminal-dot.red { background: #ff5f57; }
.terminal-dot.yellow { background: #ffbd2e; }
.terminal-dot.green { background: #28c840; }

.terminal-title {
  font-size: 0.8rem;
  color: #888;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.terminal-controls {
  display: flex;
  gap: 12px;
}

.mode-toggle {
  background: none;
  border: 1px solid var(--fg-dim);
  color: var(--fg);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.2s;
}

.mode-toggle:hover {
  background: var(--fg);
  color: var(--bg);
}

.terminal-body {
  background: rgba(10, 10, 10, 0.95);
  border: 1px solid var(--fg-dim);
  border-radius: 0 0 8px 8px;
  padding: 24px;
  min-height: 70vh;
  position: relative;
  box-shadow:
    0 0 40px rgba(0, 255, 65, 0.05),
    inset 0 0 80px rgba(0, 0, 0, 0.3);
}

body.amber .terminal-body {
  box-shadow:
    0 0 40px rgba(255, 176, 0, 0.05),
    inset 0 0 80px rgba(0, 0, 0, 0.3);
}

/* Terminal Lines */
.terminal-output {
  white-space: pre-wrap;
  word-break: break-word;
}

.line {
  opacity: 0;
  margin-bottom: 2px;
  min-height: 1.6em;
}

.line.visible {
  opacity: 1;
}

.line.typing .text {
  display: inline;
}

.prompt-symbol {
  color: var(--fg-bright);
  font-weight: 700;
}

.command {
  color: var(--fg);
  font-weight: 700;
}

.output-text {
  color: var(--fg-dim);
}

.output-text.highlight {
  color: var(--fg);
}

.output-text.bright {
  color: var(--fg-bright);
}

.output-text.error {
  color: #ff4444;
}

.output-text.warning {
  color: #ffaa00;
}

.output-text.link {
  color: var(--link);
  text-decoration: none;
  cursor: pointer;
}

.output-text.link:hover {
  text-decoration: underline;
}

.separator {
  color: var(--fg-dim);
  opacity: 0.4;
}

/* Blinking Cursor */
.cursor {
  display: inline-block;
  width: 8px;
  height: 1.2em;
  background: var(--cursor);
  vertical-align: text-bottom;
  animation: blink 1s step-end infinite;
  margin-left: 2px;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* Interactive input */
.input-line {
  display: flex;
  align-items: center;
  margin-top: 8px;
}

.input-line .prompt-symbol {
  margin-right: 0;
  white-space: pre;
}

#user-input {
  background: none;
  border: none;
  color: var(--fg);
  font-family: 'JetBrains Mono', monospace;
  font-size: 1rem;
  outline: none;
  flex: 1;
  caret-color: var(--cursor);
  line-height: 1.6;
}

/* Sound wave visualization */
.sound-wave {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  height: 1em;
  margin-left: 8px;
  vertical-align: middle;
  opacity: 0.5;
}

.sound-wave .bar {
  width: 2px;
  background: var(--fg);
  border-radius: 1px;
  animation: soundBar 1.2s ease-in-out infinite;
  transform-origin: bottom;
  will-change: transform;
}

.sound-wave .bar:nth-child(1) { height: 40%; animation-delay: 0s; }
.sound-wave .bar:nth-child(2) { height: 70%; animation-delay: 0.15s; }
.sound-wave .bar:nth-child(3) { height: 100%; animation-delay: 0.3s; }
.sound-wave .bar:nth-child(4) { height: 60%; animation-delay: 0.45s; }
.sound-wave .bar:nth-child(5) { height: 80%; animation-delay: 0.6s; }

@keyframes soundBar {
  0%, 100% { transform: scaleY(0.3); }
  50% { transform: scaleY(1); }
}

/* Tab completion hint */
.tab-hint {
  color: var(--fg-dim);
  opacity: 0.35;
  pointer-events: none;
}

/* Boot sequence */
.boot-text {
  color: var(--fg-dim);
  font-size: 0.85rem;
}

/* Language Switcher */
.lang-switcher {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 1100;
  display: flex;
  gap: 4px;
}
.lang-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 4px 10px;
  border: 1px solid var(--fg-dim);
  background: rgba(10,10,10,0.9);
  color: var(--fg-dim);
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.2s;
}
.lang-btn:hover, .lang-btn.active {
  color: var(--fg-bright);
  border-color: var(--fg-bright);
  background: rgba(0,255,65,0.1);
}
body.amber .lang-btn:hover, body.amber .lang-btn.active {
  background: rgba(255,176,0,0.1);
}

/* Responsive */
@media (max-width: 768px) {
  .terminal-wrapper {
    padding: 10px;
  }
  .terminal-body {
    padding: 16px;
    font-size: 0.85rem;
  }
  .terminal-header {
    margin-top: 10px;
  }
  .back-link {
    font-size: 0.7rem;
    padding: 4px 8px;
    top: 10px;
    left: 10px;
  }
}

@media (max-width: 480px) {
  html { font-size: 14px; }
  .terminal-body {
    padding: 12px;
    font-size: 0.8rem;
  }
}

@media (min-width: 1440px) {
  .terminal-wrapper {
    max-width: 1000px;
  }
}

/* Glow effect on text */
.glow {
  text-shadow: 0 0 5px var(--fg), 0 0 10px rgba(0, 255, 65, 0.3);
}

body.amber .glow {
  text-shadow: 0 0 5px var(--fg), 0 0 10px rgba(255, 176, 0, 0.3);
}

/* ASCII Art */
.ascii-art {
  color: var(--fg);
  font-size: 0.7rem;
  line-height: 1.2;
  letter-spacing: 0;
}

@media (max-width: 600px) {
  .ascii-art {
    font-size: 0.45rem;
  }
}
</style>

(function() {
  const canvas = document.getElementById('matrix-canvas');
  const ctx = canvas.getContext('2d');
  let w, h, columns, drops;
  const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF';

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    const fontSize = 14;
    columns = Math.floor(w / fontSize);
    drops = Array.from({ length: columns }, () => Math.random() * -100);
  }

  resize();
  window.addEventListener('resize', resize);

  function draw() {
    ctx.fillStyle = 'rgba(10, 10, 10, 0.08)';
    ctx.fillRect(0, 0, w, h);

    const isAmber = document.body.classList.contains('amber');
    ctx.fillStyle = isAmber ? '#ffb000' : '#00ff41';
    ctx.font = '14px JetBrains Mono, monospace';

    for (let i = 0; i < drops.length; i++) {
      if (drops[i] < 0) {
        drops[i] += 0.1;
        continue;
      }
      const char = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(char, i * 14, drops[i] * 14);
      if (drops[i] * 14 > h && Math.random() > 0.975) {
        drops[i] = Math.random() * -20;
      }
      drops[i]++;
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// --- Typing Engine ---
function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

function createLine() {
  const div = document.createElement('div');
  div.className = 'line';
  output.appendChild(div);
  return div;
}

async function typeText(element, text, speed = 30) {
  element.classList.add('visible');
  for (let i = 0; i < text.length; i++) {
    element.textContent += text[i];
    scrollToBottom();
    if (text[i] !== ' ') {
      await sleep(speed + Math.random() * 15);
    } else {
      await sleep(speed * 0.3);
    }
  }
}

async function printLine(text, type = 'normal', instant = false) {
  const line = createLine();
  if (type === 'ascii') {
    line.classList.add('ascii-art', 'glow');
  }
  if (instant || type === 'blank') {
    const cls = type === 'highlight' ? 'output-text highlight' :
                type === 'bright' ? 'output-text bright' :
                type === 'error' ? 'output-text error' :
                type === 'warning' ? 'output-text warning' :
                type === 'ascii' ? '' :
                'output-text';
    if (type === 'ascii') {
      line.textContent = text;
    } else {
      line.innerHTML = `<span class="${cls}">${escapeHtml(text)}</span>`;
    }
    line.classList.add('visible');
  } else {
    const span = document.createElement('span');
    span.className = type === 'highlight' ? 'output-text highlight' :
                     type === 'bright' ? 'output-text bright' :
                     'output-text';
    line.appendChild(span);
    line.classList.add('visible');
    for (let i = 0; i < text.length; i++) {
      span.textContent += text[i];
      scrollToBottom();
      await sleep(2);
    }
  }
  scrollToBottom();
}

async function typeCommand(cmd) {
  const line = createLine();
  line.classList.add('visible');

  const prompt = document.createElement('span');
  prompt.className = 'prompt-symbol';
  prompt.textContent = 'guest@portfolio:~$ ';
  line.appendChild(prompt);

  const cmdSpan = document.createElement('span');
  cmdSpan.className = 'command glow';
  line.appendChild(cmdSpan);

  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  line.appendChild(cursor);

  for (let i = 0; i < cmd.length; i++) {
    cmdSpan.textContent += cmd[i];
    scrollToBottom();
    await sleep(60 + Math.random() * 50);
  }

  cursor.remove();
  await sleep(300);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function scrollToBottom() {
  const body = document.getElementById('terminal-body');
  body.scrollTop = body.scrollHeight;
  window.scrollTo(0, document.body.scrollHeight);
}

// --- Boot & Run ---
async function bootSequence() {
  for (const step of BOOT_SEQUENCE) {
    const line = createLine();
    line.classList.add('boot-text', 'visible');
    line.textContent = step.text;
    scrollToBottom();
    await sleep(step.delay);
  }
  await sleep(400);

  await printLine('  Welcome to PortfolioOS v2.0', 'bright', true);
  await printLine('  Type "help" for available commands.', 'normal', true);
  await printLine('', 'blank', true);
  await sleep(500);
}

async function runSequence() {
  await bootSequence();

  for (const block of COMMANDS_SEQUENCE) {
    await typeCommand(block.cmd);
    await sleep(200);

    for (const line of block.output) {
      if (line.type === 'ascii') {
        await printLine(line.text, 'ascii', true);
      } else if (line.type === 'blank') {
        await printLine('', 'blank', true);
      } else {
        await printLine(line.text, line.type, true);
        await sleep(30);
      }
    }
    await sleep(600);
  }

  // Show interactive input
  inputLine.style.display = 'flex';
  userInput.focus();
  scrollToBottom();
}

// --- Interactive Commands ---
async function handleCommand(cmd) {
  const trimmed = cmd.trim().toLowerCase();
  const rawCmd = cmd.trim();
  inputLine.style.display = 'none';

  // Add to history
  if (rawCmd !== '') {
    commandHistory.push(rawCmd);
    historyIndex = commandHistory.length;
  }

  // Print the command
  const line = createLine();
  line.classList.add('visible');
  line.innerHTML = `<span class="prompt-symbol">guest@portfolio:~$ </span><span class="command glow">${escapeHtml(rawCmd)}</span>`;

  if (trimmed === 'clear') {
    output.innerHTML = '';
    inputLine.style.display = 'flex';
    userInput.value = '';
    userInput.focus();
    return;
  }

  // Gallery / back
  if (trimmed === 'gallery' || trimmed === 'cd ..' || trimmed === 'cd ../gallery') {
    await printLine('', 'blank', true);
    await printLine('  Navigating to gallery...', 'bright', true);
    await sleep(500);
    window.location.href = '../index.html';
    return;
  }

  // Date
  if (trimmed === 'date') {
    const now = new Date();
    const dateStr = now.toString();
    await printLine('', 'blank', true);
    await printLine('  ' + dateStr, 'highlight', true);
    await printLine('', 'blank', true);
    showInput();
    return;
  }

  // Fortune
  if (trimmed === 'fortune') {
    const f = FORTUNES[Math.floor(Math.random() * FORTUNES.length)];
    await printLine('', 'blank', true);
    await printLine('  ' + f, 'bright', true);
    await printLine('', 'blank', true);
    showInput();
    return;
  }

  // sudo rm -rf /
  if (trimmed === 'sudo rm -rf /' || trimmed === 'sudo rm -rf / --no-preserve-root') {
    await printLine('', 'blank', true);
    await printLine('  [sudo] password for guest: ********', 'normal', true);
    await sleep(400);
    await printLine('', 'blank', true);
    await printLine('  Nice try! But this portfolio is protected by:', 'error', true);
    await printLine('', 'blank', true);
    await printLine('    ██████╗  █████╗  ██████╗██╗  ██╗██╗   ██╗██████╗ ███████╗', 'warning', true);
    await printLine('    ██╔══██╗██╔══██╗██╔════╝██║ ██╔╝██║   ██║██╔══██╗██╔════╝', 'warning', true);
    await printLine('    ██████╔╝███████║██║     █████╔╝ ██║   ██║██████╔╝███████╗', 'warning', true);
    await printLine('    ██╔══██╗██╔══██║██║     ██╔═██╗ ██║   ██║██╔═══╝ ╚════██║', 'warning', true);
    await printLine('    ██████╔╝██║  ██║╚██████╗██║  ██╗╚██████╔╝██║     ███████║', 'warning', true);
    await printLine('    ╚═════╝ ╚═╝  ╚═╝ ╚═════╝╚═╝  ╚═╝ ╚═════╝ ╚═╝     ╚══════╝', 'warning', true);
    await printLine('', 'blank', true);
    await printLine('  Permission denied. The portfolio survives another day.', 'error', true);
    await printLine('  Incident reported to /dev/null', 'normal', true);
    await printLine('', 'blank', true);
    showInput();
    return;
  }

  // Any other sudo
  if (trimmed.startsWith('sudo ')) {
    await printLine('', 'blank', true);
    await printLine('  guest is not in the sudoers file. This incident will be reported.', 'error', true);
    await printLine('', 'blank', true);
    showInput();
    return;
  }

  // History
  if (trimmed === 'history') {
    await printLine('', 'blank', true);
    if (commandHistory.length === 0) {
      await printLine('  No commands in history.', 'normal', true);
    } else {
      for (let i = 0; i < commandHistory.length; i++) {
        const num = String(i + 1).padStart(4, ' ');
        await printLine(`  ${num}  ${commandHistory[i]}`, 'normal', true);
      }
    }
    await printLine('', 'blank', true);
    showInput();
    return;
  }

  // ls projects/ alias
  if (trimmed === 'ls projects/' || trimmed === 'ls -la projects/') {
    const lines = INTERACTIVE_COMMANDS.projects;
    for (const l of lines) {
      await printLine(l, l.includes('[') && l.includes(']') ? 'highlight' : 'normal', true);
      await sleep(15);
    }
    showInput();
    return;
  }

  const cmdKey = trimmed === 'cat about.txt' ? 'about' :
                 trimmed === 'ls skills/' || trimmed === 'ls -la skills/' ? 'skills' :
                 trimmed === 'cat contact.txt' ? 'contact' :
                 trimmed;

  const lines = INTERACTIVE_COMMANDS[cmdKey];

  if (lines) {
    for (const l of lines) {
      const ltype = (l.includes('[') && l.includes(']')) ? 'highlight' : 'normal';
      await printLine(l, ltype, true);
      await sleep(15);
    }
  } else if (trimmed !== '') {
    await printLine(`  bash: ${escapeHtml(trimmed)}: command not found`, 'normal', true);
    await printLine('  Type "help" for available commands.', 'bright', true);
    await printLine('', 'blank', true);
  }

  showInput();
}

function showInput() {
  inputLine.style.display = 'flex';
  userInput.value = '';
  userInput.focus();
  scrollToBottom();
}

// --- Tab Autocomplete ---
function tabComplete(value) {
  const lower = value.toLowerCase();
  if (lower === '') return null;
  const matches = ALL_COMMANDS.filter(c => c.startsWith(lower));
  if (matches.length === 1) return matches[0];
  if (matches.length > 1) {
    // Find longest common prefix
    let prefix = matches[0];
    for (let i = 1; i < matches.length; i++) {
      while (!matches[i].startsWith(prefix)) {
        prefix = prefix.slice(0, -1);
      }
    }
    return prefix.length > lower.length ? prefix : null;
  }
  return null;
}

// --- Key Handlers ---
userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = userInput.value;
    handleCommand(val);
    return;
  }

  // Tab autocomplete
  if (e.key === 'Tab') {
    e.preventDefault();
    const completed = tabComplete(userInput.value);
    if (completed) {
      userInput.value = completed;
    }
    return;
  }

  // Command history with up/down arrows
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (commandHistory.length > 0 && historyIndex > 0) {
      historyIndex--;
      userInput.value = commandHistory[historyIndex];
    }
    return;
  }

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIndex < commandHistory.length - 1) {
      historyIndex++;
      userInput.value = commandHistory[historyIndex];
    } else {
      historyIndex = commandHistory.length;
      userInput.value = '';
    }
    return;
  }

  // Ctrl+L to clear
  if (e.key === 'l' && e.ctrlKey) {
    e.preventDefault();
    output.innerHTML = '';
    return;
  }
});

// Focus input on click anywhere in terminal
document.getElementById('terminal-body').addEventListener('click', () => {
  if (inputLine.style.display !== 'none') {
    userInput.focus();
  }
});

var currentTermLang = 'en';

function setTermLanguage(lang) {
  if (!TERM_TRANSLATIONS[lang]) return;
  currentTermLang = lang;
  document.documentElement.lang = lang;
  // Update the COMMANDS_SEQUENCE content for future renders
  var t = TERM_TRANSLATIONS[lang];
  COMMANDS_SEQUENCE[0].output[3].text = '  Name     : ' + t.name;
  COMMANDS_SEQUENCE[0].output[4].text = '  Title    : ' + t.title;
  COMMANDS_SEQUENCE[0].output[5].text = '  Location : ' + t.location;
  COMMANDS_SEQUENCE[0].output[6].text = '  Status   : ' + t.status;
  // Update about output
  COMMANDS_SEQUENCE[1].output = [{text:'',type:'blank'}];
  t.aboutLines.forEach(function(line) {
    COMMANDS_SEQUENCE[1].output.push({text: line, type: line.trim() === '' ? 'blank' : 'normal'});
  });
  COMMANDS_SEQUENCE[1].output.push({text:'',type:'blank'});
  // Update contact help hint
  COMMANDS_SEQUENCE[3].output[COMMANDS_SEQUENCE[3].output.length - 2].text = t.helpCmdHint;
  // Update interactive command maps
  INTERACTIVE_COMMANDS.whoami = COMMANDS_SEQUENCE[0].output.map(function(o){return o.text});
  INTERACTIVE_COMMANDS.about = COMMANDS_SEQUENCE[1].output.map(function(o){return o.text});
  INTERACTIVE_COMMANDS.contact = COMMANDS_SEQUENCE[3].output.map(function(o){return o.text});

  document.querySelectorAll('.lang-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
  });
  localStorage.setItem('preferred-lang', lang);
}

document.querySelectorAll('.lang-btn').forEach(function(btn) {
  btn.addEventListener('click', function() { setTermLanguage(btn.getAttribute('data-lang')); });
});
